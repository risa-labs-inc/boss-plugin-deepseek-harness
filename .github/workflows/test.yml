name: Tests

# The RBAC guard in DshMcpToolRbacTest only pays for itself if it runs before
# a merge. build.yml fires on push to main and delegates to the shared release
# workflow, which does run `./gradlew build` (and therefore `test`) — but by then
# the version has already been bumped and the release is under way. This job runs
# the same tests on the pull request instead.
#
# ADVISORY ONLY: `main` currently has no branch protection and no rulesets, so a
# red run here does not block a merge. To make it binding, add "test" as a
# required status check on main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  profile-compatibility:
    name: Profile compatibility (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - id: floor
        name: Read the declared Node floor
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const text = readFileSync("src/main/kotlin/ai/rever/boss/plugin/dynamic/deepseekharness/DshModels.kt", "utf8");
            const floor = text.match(/MIN_VERSION = Semver\((\d+), (\d+), (\d+)\)/);
            if (!floor) process.exit(1);
            process.stdout.write(`version=${floor.slice(1).join(".")}\n`);
          ' >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.floor.outputs.version }}

      - name: Install the exact source pin into a private prefix
        shell: bash
        run: |
          set -euo pipefail
          PIN=$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const text = readFileSync("src/main/kotlin/ai/rever/boss/plugin/dynamic/deepseekharness/DshCli.kt", "utf8");
            const version = text.match(/PINNED_VERSION = "([^"]+)"/)?.[1];
            if (!version || !/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(version)) process.exit(1);
            process.stdout.write(version);
          ')
          npm install -g --prefix "$PWD/toolchain" "@deepseek-ai/dsh@$PIN" --no-audit --no-fund
          node --input-type=module -e '
            import { existsSync } from "node:fs";
            import { resolve } from "node:path";
            const root = ["toolchain/lib/node_modules/@deepseek-ai/dsh", "toolchain/node_modules/@deepseek-ai/dsh"]
              .map(path => resolve(path)).find(path => existsSync(`${path}/package.json`));
            if (!root) process.exit(1);
            process.stdout.write(`DSH_TEST_PACKAGE_ROOT=${root}\n`);
          ' >> "$GITHUB_ENV"

      - name: Verify profile migration and native Models editability
        shell: bash
        run: node --test src/test/resources/dsh-profile-update.test.mjs
        env:
          DSH_TEST_REQUIRE_PACKAGE: 'true'

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # boss-plugin-api is compileOnly (the host provides it at runtime), but the
      # tests run outside the host, so the jar has to be on the test classpath.
      # Resolved as 'latest' — the same way build.yml asks the release workflow to
      # resolve it — rather than pinned here, so there is no second version to
      # hand-bump when the api releases.
      - name: Fetch the boss-plugin-api jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p build/downloaded-deps
          API_VERSION=$(gh api repos/risa-labs-inc/boss-plugin-api/releases/latest --jq '.tag_name' | sed 's/^v//')
          echo "Resolved boss-plugin-api $API_VERSION"
          curl -fsSL -o build/downloaded-deps/boss-plugin-api.jar \
            "https://github.com/risa-labs-inc/boss-plugin-api/releases/download/v${API_VERSION}/boss-plugin-api-${API_VERSION}.jar"

      - name: Run tests
        run: ./gradlew test --no-daemon
        env:
          CI: 'true'

      # A `test` task with no test sources is NO-SOURCE and passes, so deleting the
      # guard would silently turn it off with a green build. Require its results.
      - name: Assert the RBAC guard actually ran
        run: |
          RESULTS='build/test-results/test/TEST-ai.rever.boss.plugin.dynamic.deepseekharness.DshMcpToolRbacTest.xml'
          if [ ! -f "$RESULTS" ]; then
            echo "::error::DshMcpToolRbacTest produced no results — the RBAC guard did not run."
            exit 1
          fi
          grep -q 'tests="[1-9]' "$RESULTS" || {
            echo "::error::DshMcpToolRbacTest ran zero test cases."; exit 1; }
          echo "RBAC guard ran:"; grep -o 'tests="[0-9]*"[^>]*failures="[0-9]*"' "$RESULTS" | head -1
